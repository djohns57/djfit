name: amazee.ai AI Provider Install
type: AI
description: Automates the setup of the amazee.ai AI provider.
install:
  - key
  - ai
  - ai_provider_amazeeio
  - ai_search
  - search_api
input:
  llm_host:
    data_type: string
    description: The amazee.ai AI LLM Host URL.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai AI LLM Host URL:'
    default:
      source: value
      value: ''
  llm_api_key:
    data_type: string
    description: The amazee.ai AI API key.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai AI LLM API key:'
    default:
      source: value
      value: ''
  postgres_db_host:
    data_type: string
    description: The amazee.ai PostGreSQL host.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai PostGreSQL host:'
    default:
      source: value
      value: ''
  postgres_db_port:
    data_type: integer
    description: The amazee.ai PostGreSQL port.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai PostGreSQL port:'
    default:
      source: value
      value: '5432'
  postgres_db_username:
    data_type: string
    description: The amazee.ai PostGreSQL username.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai PostGreSQL username:'
    default:
      source: value
      value: ''
  postgres_db_password:
    data_type: string
    description: The amazee.ai PostGreSQL password.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai PostGreSQL password:'
    default:
      source: value
      value: ''
  postgres_db_default_database:
    data_type: string
    description: The amazee.ai PostGreSQL default database.
    prompt:
      method: ask
      arguments:
        question: 'The amazee.ai PostGreSQL default database:'
    default:
      source: value
      value: ''
config:
  strict: false
  import:
    ai_provider_amazeeio:
      - ai_provider_amazeeio.settings
      - key.key.amazeeio_ai_database
      # key.key.amazeeio_ai cannot be imported because setupAiProvider
      # does not work with existing keys.
  actions:
    key.key.amazeeio_ai_database:
      simpleConfigUpdate:
        key_provider_settings:
          key_value: ${postgres_db_password}
    ai_provider_amazeeio.settings:
      simpleConfigUpdate:
        host: ${llm_host}
        postgres_host: ${postgres_db_host}
        postgres_port: ${postgres_db_port}
        postgres_username: ${postgres_db_username}
        postgres_default_database: ${postgres_db_default_database}
      setupAiProvider:
        key_value: ${llm_api_key}
        key_name: amazeeio_ai
        key_label: 'amazee.ai AI LLM API Key'
        provider: amazeeio
      ensureAmazeeAiAccess: ~
