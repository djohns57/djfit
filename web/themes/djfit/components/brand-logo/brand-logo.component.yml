$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Brand Logo
group: Base
status: stable
props:
  type: object
  properties:
    url:
      type: string
      title: Link
      default: "/"
      examples:
        - "/"
    show_jps:
      type: boolean
      title: Show JPS Enterprise
      default: true
      examples:
        - true
    show_djfit:
      type: boolean
      title: Show DJ Fit
      default: true
      examples:
        - true
    size:
      type: string
      title: Size
      enum:
        - small
        - medium
        - large
        - header
      meta:enum:
        small: Small (24px)
        medium: Medium (32px)
        large: Large (40px)
        header: Header (60px)
      default: header
      examples:
        - header
