"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Membership pricing table
group: Membership
description: Displays membership plans with purchase buttons.
props:
  type: object
  properties:
    heading_text:
      type: string
      title: Heading
      examples:
        - Choose your membership
    description:
      type: string
      title: Description
      examples:
        - Start with one plan and upgrade anytime.
    basic_title:
      type: string
      title: Basic title
      default: Basic
    basic_price:
      type: string
      title: Basic price
      default: "29"
    basic_features:
      type: string
      title: Basic features
      contentMediaType: text/html
      x-formatting-context: block
      default: "<ul><li>Community access</li><li>Monthly Q&A</li></ul>"
    basic_button_label:
      type: string
      title: Basic button label
      default: Choose Basic
    basic_button_url:
      type: string
      title: Basic button URL
    pro_title:
      type: string
      title: Pro title
      default: Pro
    pro_price:
      type: string
      title: Pro price
      default: "79"
    pro_features:
      type: string
      title: Pro features
      contentMediaType: text/html
      x-formatting-context: block
      default: "<ul><li>Everything in Basic</li><li>Weekly programming</li><li>Member events</li></ul>"
    pro_button_label:
      type: string
      title: Pro button label
      default: Choose Pro
    pro_button_url:
      type: string
      title: Pro button URL
    premium_title:
      type: string
      title: Premium title
      default: Premium
    premium_price:
      type: string
      title: Premium price
      default: "149"
    premium_features:
      type: string
      title: Premium features
      contentMediaType: text/html
      x-formatting-context: block
      default: "<ul><li>Everything in Pro</li><li>Priority coaching</li><li>Quarterly strategy call</li></ul>"
    premium_button_label:
      type: string
      title: Premium button label
      default: Choose Premium
    premium_button_url:
      type: string
      title: Premium button URL
