name: Home CTA
status: stable
description: Call-to-action section with heading, subtitle, action buttons, and trust badges.
group: Homepage

props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      default: "Ready to Transform Your Health?"
    subtitle:
      type: string
      title: Subtitle
      default: "Get instant access to our complete library of workouts, nutrition guides, and expert coaching."
    primary_button_label:
      type: string
      title: Primary Button Label
      default: "View Membership Plans"
    primary_button_url:
      type: string
      title: Primary Button URL
      default: "/membership"
    secondary_button_label:
      type: string
      title: Secondary Button Label
      default: "Explore Free Content"
    secondary_button_url:
      type: string
      title: Secondary Button URL
      default: "/blog"
    badge1_text:
      type: string
      title: Trust Badge 1
      default: "Cancel anytime"
    badge2_text:
      type: string
      title: Trust Badge 2
      default: "30-day guarantee"
