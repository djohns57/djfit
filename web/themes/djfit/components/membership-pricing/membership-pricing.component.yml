name: Membership Pricing
status: experimental
props:
  type: object
  properties:
    basic_name:
      type: string
      title: Basic Plan Name
      default: 'Basic'
    basic_description:
      type: string
      title: Basic Plan Description
      default: 'Perfect for getting started with structured fitness'
    basic_price:
      type: string
      title: Basic Price
      default: '$29'
    basic_cta_text:
      type: string
      title: Basic CTA Text
      default: 'Start Basic'
    basic_cta_url:
      type: string
      title: Basic CTA URL
      default: '/product/1'
    pro_name:
      type: string
      title: Pro Plan Name
      default: 'Pro'
    pro_description:
      type: string
      title: Pro Plan Description
      default: 'Complete access to everything you need to succeed'
    pro_price:
      type: string
      title: Pro Price
      default: '$49'
    pro_cta_text:
      type: string
      title: Pro CTA Text
      default: 'Start Pro'
    pro_cta_url:
      type: string
      title: Pro CTA URL
      default: '/product/2'
libraryOverrides:
  css:
    component:
      membership-pricing.tailwind.css: {}
