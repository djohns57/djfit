      default: 'Real success stories and transformations from men just like you'
    card_3_title:
      type: string
      title: Card 3 Title
      default: 'Exclusive Content'
    card_3_text:
      type: string
      title: Card 3 Text
      default: 'Early access to new programs, resources, and special member-only offers'
libraryOverrides:
  css:
    component:
      newsletter-benefits.tailwind.css: {}
