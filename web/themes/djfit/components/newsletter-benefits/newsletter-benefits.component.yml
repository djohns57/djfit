$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Newsletter Benefits
group: Content
status: experimental
props:
  type: object
  properties:
    heading:
      type: string
      title: Section Heading
      default: "What You'll Receive"
    card_1_title:
      type: string
      title: Card 1 Title
      default: 'Expert Insights'
    card_1_text:
