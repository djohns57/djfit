"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Video card
group: Card
description: A card with embedded video and supporting text.
props:
  type: object
  required:
    - title
    - video_url
  properties:
    title:
      type: string
      title: Title
      examples:
        - Watch our latest workout
    description:
      type: string
      title: Description
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - A quick overview of our training programs and philosophy.
    video_url:
      type: string
      title: Video URL
      examples:
        - https://www.youtube.com/watch?v=dQw4w9WgXcQ
        - https://vimeo.com/148751763
    background:
      type: string
      title: Background
      enum:
        - default
        - accent
        - primary
        - inverted
        - noColor
      meta:enum:
        default: Default
        accent: Accent
        primary: Primary
        inverted: Inverted
        noColor: No color
      default: noColor
      examples:
        - noColor
