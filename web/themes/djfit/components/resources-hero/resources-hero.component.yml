$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Resources Hero
status: stable
description: Resources page hero banner with gradient background, heading, and subtitle.
group: Resources
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      default: "Templates & Guides"
      examples:
        - "Templates & Guides"
    subtitle:
      type: string
      title: Subtitle
      default: "Downloadable resources to support your fitness journey. Workout plans, nutrition guides, and tracking tools."
      examples:
        - "Downloadable resources to support your fitness journey. Workout plans, nutrition guides, and tracking tools."
libraryOverrides:
  css:
    component:
      resources-hero.tailwind.css: {}
