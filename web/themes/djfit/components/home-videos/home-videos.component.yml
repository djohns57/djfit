$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Home Videos
group: Layout
status: experimental
props:
  type: object
  properties:
    section_heading:
      type: string
      title: Section heading
      default: "Featured Videos"
    section_subtitle:
      type: string
      title: Section subtitle
      default: "Watch and learn from our expert trainers"
    library_url:
      type: string
      title: Video Library URL
      default: "/videos"
    video1_heading:
      type: string
      title: Video 1 heading
      default: "Complete Full Body Workout - 30 Minutes"
    video1_body:
      type: string
      title: Video 1 description
      default: "Efficient strength training for busy professionals"
    video1_url:
      type: string
      title: Video 1 URL
      default: "/videos/full-body-workout"
    video1_image_url:
      type: string
      title: Video 1 thumbnail URL
      default: ""
    video1_badge:
      type: string
      title: Video 1 badge text
      default: "FREE"
      enum:
        - FREE
        - MEMBERS
        - PREMIUM
    video1_locked:
      type: string
      title: Video 1 locked
      description: "yes = show lock icon, no = show play icon"
      default: "no"
      enum:
        - "yes"
        - "no"
    video2_heading:
      type: string
      title: Video 2 heading
      default: "Advanced Mobility and Recovery Protocol"
    video2_body:
      type: string
      title: Video 2 description
      default: "Premium content for enhanced flexibility and injury prevention"
    video2_url:
      type: string
      title: Video 2 URL
      default: "/videos/mobility-recovery"
    video2_image_url:
      type: string
      title: Video 2 thumbnail URL
      default: ""
    video2_badge:
      type: string
      title: Video 2 badge text
      default: "MEMBERS"
      enum:
        - FREE
        - MEMBERS
        - PREMIUM
    video2_locked:
      type: string
      title: Video 2 locked
      description: "yes = show lock icon, no = show play icon"
      default: "yes"
      enum:
        - "yes"
        - "no"
