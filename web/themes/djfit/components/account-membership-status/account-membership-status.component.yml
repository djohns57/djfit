"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Account membership status
group: Membership
description: Displays a member account status summary.
props:
  type: object
  properties:
    status:
      type: string
      title: Membership status
      enum:
        - active
        - trialing
        - past_due
        - canceled
        - expired
      default: active
    plan_name:
      type: string
      title: Plan name
      default: Pro Monthly
    renewal_text:
      type: string
      title: Renewal details
      default: Renews on the 15th of each month.
    button_label:
      type: string
      title: Manage button label
      default: Manage billing
    button_url:
      type: string
      title: Manage button URL
      default: /user
