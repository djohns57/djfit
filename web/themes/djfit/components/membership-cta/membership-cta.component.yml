$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Membership CTA
group: Membership
status: stable
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
      default: "Ready to Get Started?"
      examples:
        - "Ready to Get Started?"
    subtitle:
      type: string
      title: Subtitle
      default: "Join thousands of men over 40 who are building strength, health, and longevity."
      examples:
        - "Join thousands of men over 40 who are building strength, health, and longevity."
    primary_cta_text:
      type: string
      title: Primary CTA Text
      default: "Start Your Journey"
      examples:
        - "Start Your Journey"
    primary_cta_url:
      type: string
      title: Primary CTA URL
      default: "/product/2"
      examples:
        - "/product/2"
    secondary_cta_text:
      type: string
      title: Secondary CTA Text
      default: "Explore Free Content"
      examples:
        - "Explore Free Content"
    secondary_cta_url:
      type: string
      title: Secondary CTA URL
      default: "/blog"
      examples:
        - "/blog"
libraryOverrides:
  css:
    component:
      membership-cta.tailwind.css: {}
