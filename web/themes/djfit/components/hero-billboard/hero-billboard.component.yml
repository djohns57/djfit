"$schema": "https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json"
name: Hero billboard
group: Hero
props:
  type: object
  required:
    - height
    - flex_position
    - object_position
    - overlay_opacity
  properties:
    height:
      type: string
      title: Height
      enum:
        - full
        - large
        - ribbon
      meta:enum:
        full: Full screen
        large: Large
        ribbon: Ribbon
      default: full
      examples:
        - full
    flex_position:
      type: string
      title: Content position
      enum:
        - top-left
        - center-left
        - bottom-left
        - bottom-center
        - hero-center
      meta:enum:
        top-left: Top left
        center-left: Center left
        bottom-left: Bottom left
        bottom-center: Bottom center
        hero-center: Center
      default: bottom-center
      examples:
        - bottom-center
    overlay_opacity:
      type: string
      title: Overlay opacity
      enum:
        - "0%"
        - "20%"
        - "40%"
        - "60%"
        - "75%"
      default: "0%"
      examples:
        - "0%"
    object_position:
      type: string
      title: Background image position
      enum:
        - top
        - center
        - bottom
      default: center
      examples:
        - center
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Background image
      type: object
      examples:
        - src: "assets/luke-chesser-pJadQetzTkI-unsplash.jpg"
          alt: "Green blue gradient placeholder image"
          width: 1920
          height: 1344
    heading_text:
      type: string
      title: Heading
      description: The main headline displayed over the hero image.
      examples:
        - "Welcome to DJFit"
    subheading_text:
      type: string
      title: Subheading
      description: A short supporting line below the heading.
      examples:
        - "Your fitness journey starts here"
    body_text:
      type: string
      title: Body text
      contentMediaType: text/html
      x-formatting-context: block
      description: Optional rich text content below the subheading.
      examples:
        - "<p>Join us today and transform your life.</p>"
    overlap_navbar:
      type: boolean
      title: Overlap header
      description: Enable this to place it behind the header, if it is the first item on the page.
      default: false
      examples:
        - false

slots:
  hero_slot:
    title: "Additional content"
