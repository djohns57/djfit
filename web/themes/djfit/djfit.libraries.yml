global:
  version: VERSION
  css:
    theme:
      src/fonts.css:
        preprocess: false
      build/main.min.css:
        # Avoid attempting to re-minify main.min.css. Also ensure it's served in
        # its own right so that browsers only download it once, instead of via
        # aggregates where it may get duplicated across files.
        preprocess: false
        minified: true
      src/theme.css:
        preprocess: false
      css/commerce.css:
        preprocess: false

messages:
  version: VERSION
  js:
    lib/messages.js: {}
  dependencies:
    - core/drupal
    - core/once

breadcrumb:
  version: VERSION
  dependencies:
    - core/drupal

commerce_cart_count:
  version: VERSION
  js:
    lib/commerce-cart-count.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings

nav_auth_state:
  version: VERSION
  js:
    lib/nav-auth-state.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
